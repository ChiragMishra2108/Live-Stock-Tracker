{% extends "layout.html" %}

{% block title %}
    Tracking
{% endblock %}

{% block main %}
    <h1>Live Price Update</h1>
    <p>Price : <strong id="price">Loading....</strong></p>
    <p>A mail will be sent to you as soon as the price drops</p>
    <script>
        function startLiveUpdate()
        {
            let symbol = "{{ symbol }}";
            let priceElement = document.getElementById('price');
            let min_price=parseFloat("{{ min_price }}");
            setInterval(async function() {
                let response = await fetch(`/tracking/${symbol}`);
                let stock = await response.json();
                if (stock.price<min_price)
                {
                    fetch('/mail',
                    {
                        method: 'POST'
                    });
                }
                priceElement.innerHTML = stock.price;
            }, 500);
        }
        startLiveUpdate();
    </script>
{% endblock %}
