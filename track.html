{% extends "layout.html" %}

{% block title %}
    Track
{% endblock %}

{% block main %}
    <form action="/track" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Symbol" type="text">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="min_price" placeholder="Your buying price" type="text">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="mail" placeholder="Mail" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Track</button>
    </form>
{% endblock %}
